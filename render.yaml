# Render Blueprint: deploys the same two Docker images used by docker-compose.
# MongoDB is provided by MongoDB Atlas (set MONGO_URI when prompted).
# See README "Deploying to Render" for the step-by-step guide.
services:
  - type: web
    name: triad-dms-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false            # Atlas connection string (entered in the dashboard)
      - key: MONGO_DB_NAME
        value: TriadAI
      - key: SECRET_KEY
        generateValue: true    # random JWT signing key generated by Render
      - key: ALLOW_UNAUTHENTICATED_TEST_UPLOAD
        value: "false"         # never accept anonymous uploads on the public site
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO_USERS
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@triad.ai
      - key: ADMIN_PASSWORD
        sync: false            # choose a strong password; shared privately
      - key: ADMIN_DIVISION
        value: Division A
      - key: GUNICORN_WORKERS
        value: "1"             # free instances have 512 MB RAM
      - key: GUNICORN_THREADS
        value: "4"
      - key: UNSTRACT_API_KEY
        sync: false            # optional cloud OCR fallback; leave empty to skip

  - type: web
    name: triad-dms-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildFilter:
      paths:
        - frontend/**
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        sync: false            # public URL of the backend, e.g. https://triad-dms-backend.onrender.com
      - key: NGINX_RESOLVER
        value: "1.1.1.1 8.8.8.8" # public DNS: Render's internal DNS routes *.onrender.com
                                 # to the private network, which free services can't receive
