# Runs the whole project: MongoDB + Flask API (with Tesseract OCR) + React app.
#
#   docker compose up --build
#
#   Web app: http://localhost:3000
#   API:     http://localhost:5000/api   (the company's test script uses this)
#
# No setup needed. To change a setting (for example to use MongoDB Atlas
# instead of the MongoDB container), put it in a .env file next to this one.
# See .env.example.
#
# All ports are opened on this computer only (127.0.0.1), not to the network.

name: triad-dms

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db        # data survives restarts
    ports:
      - "127.0.0.1:27017:27017"   # handy for MongoDB Compass
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-triad_dms}
      # Fine for a local run. A real server must use its own long random key.
      SECRET_KEY: ${SECRET_KEY:-local-docker-dev-secret-change-me-0123456789}
      # The company's test_api.py uploads without logging in, so this local
      # setup allows that one anonymous upload. It is off on the live site.
      ALLOW_UNAUTHENTICATED_TEST_UPLOAD: ${ALLOW_UNAUTHENTICATED_TEST_UPLOAD:-true}
      # Create the admin and demo accounts from the README on first start.
      SEED_ON_START: "true"
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@triad.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Password123!}
      ADMIN_DIVISION: ${ADMIN_DIVISION:-Division A}
      UNSTRACT_API_KEY: ${UNSTRACT_API_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy   # wait until MongoDB is really ready

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKEND_URL: http://backend:5000
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
