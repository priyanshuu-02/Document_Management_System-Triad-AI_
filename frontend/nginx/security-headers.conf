# Browser safety headers, included in every location of default.conf.template.
# (nginx drops server-level add_header lines inside a location that has its own,
# so they are listed here once and included everywhere.)

# Only load scripts, styles and data from this site. Inline styles are allowed
# because the animation library sets them; inline scripts are not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Don't let other sites put this app inside a frame (stops click-jacking).
add_header X-Frame-Options "DENY" always;
# Don't let the browser guess file types.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
